name: juce_flutter_shell
description: >
  JUCE + Flutter 插件模板的通用「壳」代码（AudioBridge 平台通道桥接 /
  调试控制台页面 / 应用入口启动器），由 JucyFlutter 模板仓库维护，
  供下游插件工程以 git submodule 方式复用。
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
