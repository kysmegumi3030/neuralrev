name: neuralrev_ui
description: Flutter UI for NeuralRev reverb plugin
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # 共享「壳」代码（AudioBridge / DebugLogPage / runJuceFlutterApp）
  # 由 JucyFlutter 模板仓库维护，下游插件工程通过 vendor/JucyFlutter
  # submodule 以相对路径依赖同一份代码。
  juce_flutter_shell:
    path: packages/juce_flutter_shell

  # 状态管理
  provider: ^6.1.1

  # 图标
  flutter_svg: ^2.0.9

  # 自定义字体
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Flutter assets 目录（打包后由 JUCE 加载）
  assets:
    - assets/images/
    - assets/fonts/

  # 自定义字体（可选）
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf